[project]
name = "mhsquare-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.40",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.9",
  "argon2-cffi==23.1.0",
  "celery[redis]==5.5.2",
  "redis==5.2.1",
  "httpx==0.28.1",
  "pyyaml==6.0.2",
  "python-multipart==0.0.20",
  "pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.8"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501"]  # line length is enforced by ruff format

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]
"app/services/**" = ["S603", "S607"]  # ffmpeg/ffprobe via argument lists, never a shell

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
