# Visual-type routing — EXAMPLE (committed). Copy to config/routing.yaml (gitignored).
# Values are LiteLLM model ALIASES (defined in litellm/config.yaml), never provider model IDs.
# Which provider/model an alias points to is set in the UI (Settings → AI providers).

visual_types:
  code_animation:
    generator: html_motion         # LLM writes an HTML/GSAP scene -> sandboxed Chromium renders it
    llm_model: code-llm
    fallbacks: [code-llm-backup]
  ai_clip:
    generator: video
    model: video-gen
    keyframe_model: image-gen
    durations_allowed: [4, 6, 8]
    fallbacks: [video-gen-fast]
  still_image:
    generator: image               # image + animated overlay (push-in, callouts) via html_motion
    model: image-gen
    llm_model: code-llm
    motion: ken_burns
  text_card:
    generator: template            # rendered locally, no AI cost
  a_roll:
    generator: passthrough         # face-cam footage
planner:
  model: planner-llm
  fallbacks: []
  # Visual types the planner may use. Remove still_image / ai_clip while no image/video
  # provider has credits — story scenes then become illustrated (SVG) motion scenes.
  allowed_visual_types: [code_animation, still_image, ai_clip, text_card, a_roll]
