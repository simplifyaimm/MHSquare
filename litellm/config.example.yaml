# LiteLLM proxy config — EXAMPLE (committed). setup copies it to litellm/config.yaml (gitignored).
#
# Nothing here is user-specific: every model ID and provider key is read via os.environ/...
# Those values live in local/llmconfig.env, which is edited from the mhsquare UI
# (Settings → AI providers) and never committed. Defaults: litellm/llm-defaults.env.
# LiteLLM picks the provider key from the model prefix (anthropic/ → ANTHROPIC_API_KEY,
# gemini/ → GEMINI_API_KEY, openai/ → OPENAI_API_KEY, openrouter/ → OPENROUTER_API_KEY).
#
# The aliases (model_name) are what config/routing.yaml refers to. They are provider-neutral.

model_list:
  - model_name: planner-llm
    litellm_params: { model: os.environ/MH_MODEL_PLANNER_LLM }
  - model_name: code-llm
    litellm_params: { model: os.environ/MH_MODEL_CODE_LLM }
  - model_name: code-llm-backup
    litellm_params: { model: os.environ/MH_MODEL_CODE_LLM_BACKUP }
  - model_name: image-gen
    litellm_params: { model: os.environ/MH_MODEL_IMAGE_GEN }
  # video via LiteLLM /videos (Gemini/Vertex Veo). The Sora API is shut down — don't use it.
  - model_name: video-gen
    litellm_params: { model: os.environ/MH_MODEL_VIDEO_GEN }
  - model_name: video-gen-fast
    litellm_params: { model: os.environ/MH_MODEL_VIDEO_GEN_FAST }

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
